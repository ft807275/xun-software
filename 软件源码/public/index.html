<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>勋的软件</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/skillbank.js" defer></script>
    <script src="/guide.js" defer></script>
    <script src="/wiki.js" defer></script>
    <script src="/presets.js" defer></script>
    <script src="/import_history.js" defer></script>
    <script src="/export_queue.js" defer></script>
    <script src="/project_search.js" defer></script>
    <script src="/workspace.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <button
          type="button"
          class="brand brand-home"
          data-view="home"
          aria-label="返回系统首页"
        >
          <img src="/favicon.svg" width="44" height="44" alt="" /><b
            class="brand-name"
            ><span>勋的软件</span></b
          >
        </button>
        <nav class="primary-nav" aria-label="一级类目"></nav>
        <div class="industry-box">
          <label for="industry">当前行业</label>
          <div>
            <select id="industry" aria-label="切换行业"></select
            ><button
              type="button"
              data-action="newindustry"
              aria-label="添加行业"
              title="添加行业"
            >
              ＋
            </button>
          </div>
        </div>
        <nav id="library-nav" aria-label="关键词库功能" hidden>
          <button class="nav-button" data-view="words">关键词库</button
          ><button class="nav-button" data-view="types">产品分类</button
          ><button class="nav-button" data-view="sites">同行网站</button
          ><button class="nav-button" data-view="gallery">产品图库</button
          ><button class="nav-button" data-view="gallery-all">跨行业找图</button
          ><button class="nav-button" data-view="imports">导入记录</button
          ><button class="nav-button" data-view="rules">排除规则</button>
        </nav>
        <nav id="build-nav" aria-label="建站功能" hidden>
          <button class="nav-button" data-view="sitemap">网站地图</button>
          <button class="nav-button" data-view="workflows">建站流程</button>
          <button class="nav-button" data-view="buildsearch">查找建站记录</button>
          <button class="nav-button" data-view="materials">建站资料库</button>
          <button class="nav-button" data-view="siteplan">
            官网一级栏目规划
          </button>
        </nav>
        <button type="button" class="text-button back-home" data-view="home">
          返回系统首页
        </button>
        <div class="sidebar-foot" id="access">私人资料库</div>
      </aside>
      <main class="workspace">
        <header class="topbar">
          <button id="go-back" class="nav-back" type="button" aria-label="返回上一页" title="当前没有上一页" disabled>←</button>
          <span class="crumb">
            <span id="workspace-name">我的工作区</span>
            <span class="crumb-divider" aria-hidden="true">/</span>
            <span id="crumb">系统首页</span>
          </span>
          <span id="privacy" class="privacy">私人资料库</span>
        </header>
        <div class="content">
          <div class="page-head">
            <div>
              <h1 id="heading">系统首页</h1>
              <p class="subtitle" id="sub"></p>
            </div>
            <div class="actions" id="actions"></div>
          </div>
          <div id="summary" class="metrics"></div>
          <div id="filters"></div>
          <div id="feedback" role="status"></div>
          <section
            id="panel"
            class="list-panel"
            aria-label="资料列表"
          ></section>
        </div>
      </main>
    </div>
    <dialog id="dialog">
      <div class="modal-head">
        <button class="nav-back" data-action="close" type="button" title="返回当前页面" aria-label="返回当前页面">←</button>
        <h2 id="dialog-title"></h2>
        <button
          type="button"
          data-action="close"
          class="close"
          aria-label="关闭"
        >
          ×
        </button>
      </div>
      <div class="modal-body" id="dialog-body"></div>
    </dialog>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
